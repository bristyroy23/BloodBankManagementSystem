
<!DOCTYPE html>
<html>
<head>
    <title>Donor Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🩸 Donor Management</h1>

    <div class="login-box">
        <h2 id="formTitle">Add New Donor</h2>

        <form id="donorForm">

            <label>Donor Name</label>
            <input type="text" id="name" placeholder="Enter donor name" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email">

            <label>Age</label>
            <input type="number" id="age" placeholder="Enter age" required>

            <label>Gender</label>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>

            <label>Blood Group</label>
            <select id="blood_group" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <label>Address</label>
            <input type="text" id="address" placeholder="Enter address">

            <label>Last Donation Date</label>
            <input type="date" id="last_donation">

            <button type="submit" id="submitBtn">Add Donor</button>
            <button type="button" id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel Edit</button>

        </form>

        <br>
        <a href="admindashboard.html">Back to Dashboard</a>
    </div>

    <div class="login-box">
        <h2>All Donors</h2>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Blood Group</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="donorList"></tbody>
        </table>
    </div>

<script>

let editingDonorId = null;

// Get form data
function getDonorData() {
    return {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        age: document.getElementById("age").value,
        gender: document.getElementById("gender").value,
        blood_group: document.getElementById("blood_group").value,
        address: document.getElementById("address").value,
        last_donation: document.getElementById("last_donation").value || null
    };
}

// Add or Update Donor
document.getElementById("donorForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const donor = getDonorData();

    const url = editingDonorId
        ? `http://localhost:5000/api/donors/update/${editingDonorId}`
        : "http://localhost:5000/api/donors/add";

    const method = editingDonorId ? "PUT" : "POST";

    try {

        const response = await fetch(url, {
            method: method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(donor)
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Operation Failed");
            return;
        }

        alert(editingDonorId ? "Donor Updated Successfully!" : "Donor Added Successfully!");

        cancelEdit();
        loadDonors();

    } catch (error) {
        alert("Backend Connection Failed!");
        console.error(error);
    }

});

// Load All Donors
async function loadDonors() {

    try {

        const response = await fetch("http://localhost:5000/api/donors/all");
        const data = await response.json();

        const donorList = document.getElementById("donorList");

        donorList.innerHTML = "";

        data.donors.forEach(donor => {

            donorList.innerHTML += `
                <tr>
                    <td>${donor.id}</td>
                    <td>${donor.name}</td>
                    <td>${donor.phone}</td>
                    <td>${donor.email || ""}</td>
                    <td>${donor.blood_group || ""}</td>
                    <td>
                        <button type="button" onclick="editDonor(${donor.id})">Edit</button>
                        <button type="button" onclick="deleteDonor(${donor.id})">Delete</button>
                    </td>
                </tr>
            `;

        });

    } catch (error) {
        alert("Donor List Load Failed!");
        console.error(error);
    }

}

// Edit Donor
async function editDonor(id) {

    try {

        const response = await fetch("http://localhost:5000/api/donors/all");
        const data = await response.json();

        const donor = data.donors.find(item => item.id == id);

        if (!donor) {
            alert("Donor Not Found!");
            return;
        }

        editingDonorId = id;

        document.getElementById("name").value = donor.name;
        document.getElementById("phone").value = donor.phone;
        document.getElementById("email").value = donor.email || "";
        document.getElementById("age").value = donor.age;
        document.getElementById("gender").value = donor.gender;
        document.getElementById("blood_group").value = donor.blood_group;
        document.getElementById("address").value = donor.address || "";
        document.getElementById("last_donation").value =
            donor.last_donation ? String(donor.last_donation).substring(0, 10) : "";

        document.getElementById("formTitle").innerText = "Edit Donor";
        document.getElementById("submitBtn").innerText = "Update Donor";
        document.getElementById("cancelBtn").style.display = "inline-block";

        window.scrollTo(0, 0);

    } catch (error) {
        alert("Donor Load Failed!");
        console.error(error);
    }

}

// Cancel Edit
function cancelEdit() {

    editingDonorId = null;

    document.getElementById("donorForm").reset();
    document.getElementById("formTitle").innerText = "Add New Donor";
    document.getElementById("submitBtn").innerText = "Add Donor";
    document.getElementById("cancelBtn").style.display = "none";

}

// Delete Donor
async function deleteDonor(id) {

    if (!confirm("Are you sure you want to delete this donor?")) {
        return;
    }

    try {

        const response = await fetch(`http://localhost:5000/api/donors/delete/${id}`, {
            method: "DELETE"
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Donor Delete Failed");
            return;
        }

        alert("Donor Deleted Successfully!");

        loadDonors();

    } catch (error) {
        alert("Backend Connection Failed!");
        console.error(error);
    }

}

loadDonors();

</script>

</body>
</html>

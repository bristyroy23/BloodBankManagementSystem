
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🩸 Blood Bank Admin Dashboard</h1>

    <h2>Welcome Admin, <span id="adminName">Admin</span>!</h2>

    <div class="cards">

        <div class="card">
            <h3>Donor Management</h3>
            <a href="doners.html">Manage Donors</a>
        </div>

        <div class="card">
            <h3>Blood Stock</h3>
            <a href="blood-stock.html">Manage Stock</a>
        </div>

        <div class="card">
            <h3>Blood Requests</h3>
            <a href="manage-request.html">Manage Requests</a>
        </div>

        <div class="card">
            <h3>User Management</h3>
            <a href="#">Manage Users</a>
        </div>

        <div class="card">
            <h3>Hospital Management</h3>
            <a href="hospital.html">Manage Hospital</a>
        </div>

        <div class="card">
            <h3>Blood Compatibility</h3>
            <a href="blood-compatibility.html">Check Compatibility</a>
        </div>

    </div>

    <br>

    <a href="#" onclick="logout()">Logout</a>

    <script>
        const admin = JSON.parse(localStorage.getItem("user"));
        const role = localStorage.getItem("role");

        if (!admin || role !== "admin") {
            window.location.href = "login.html";
        } else {
            document.getElementById("adminName").textContent = admin.name;
        }

        function logout() {
            localStorage.removeItem("user");
            localStorage.removeItem("role");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>

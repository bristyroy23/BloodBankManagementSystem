
<!DOCTYPE html>
<html>
<head>
    <title>Find Blood Donor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🩸 Find Blood Donor</h1>

    <div class="login-box">
        <h2>Search Donor</h2>

        <label>Blood Group:</label>
        <select id="bloodGroup">
            <option value="">All Blood Groups</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <button onclick="searchDonors()">Search</button>
    </div>

    <h2>Available Donors</h2>

    <div id="donorList"></div>

    <br>
    <a href="userdashboard.html">Back to Dashboard</a>

    <script>
        const API_URL = "http://localhost:5000/api/donors/all";

        async function searchDonors() {
            const selectedGroup =
                document.getElementById("bloodGroup").value;

            const donorList =
                document.getElementById("donorList");

            donorList.innerHTML = "Loading...";

            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error("Donor fetch failed");
                }

                const donors = data.donors.filter(donor =>
                    !selectedGroup ||
                    donor.blood_group === selectedGroup
                );

                if (donors.length === 0) {
                    donorList.innerHTML = "<p>No donor found.</p>";
                    return;
                }

                donorList.innerHTML = donors.map(donor => `
                    <div class="card">
                        <h3>${escapeHTML(donor.name)}</h3>
                        <p>Blood Group: ${escapeHTML(donor.blood_group || "")}</p>
                        <p>Phone: ${escapeHTML(donor.phone || "")}</p>
                        <p>Age: ${escapeHTML(donor.age || "")}</p>
                        <p>Gender: ${escapeHTML(donor.gender || "")}</p>
                        <p>Address: ${escapeHTML(donor.address || "Not provided")}</p>
                    </div>
                `).join("");

            } catch (error) {
                donorList.innerHTML =
                    "<p>Could not load donors. Check the backend server.</p>";
                console.error(error);
            }
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[char]);
        }

        searchDonors();
    </script>

</body>
</html>

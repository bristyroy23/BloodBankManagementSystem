```html
<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🩸 Blood Bank</h1>

    <h2 id="welcomeMessage">Welcome User!</h2>

    <div class="cards">

        <div class="card">
            <h2>Find Donor</h2>
            <p>Find blood donors.</p>
            <a href="find-donor.html">Search Donor</a>
        </div>

        <div class="card">
            <h2>Blood Request</h2>
            <p>Request for blood.</p>
            <a href="blood-request.html">Request Blood</a>
        </div>

        <div class="card">
            <h2>My Requests</h2>
            <p>Check your requests.</p>
            <a href="my-requests.html">View Requests</a>
        </div>

        <div class="card">
            <h2>My Profile</h2>
            <p>Manage your information.</p>
            <a href="my-profile.html">My Profile</a>
        </div>

    </div>

    <br>

    <a href="#" onclick="logout()">Logout</a>

    <script>

        // Show User Name
        const user = JSON.parse(localStorage.getItem("user"));
        const role = localStorage.getItem("role");

        if (!user || role !== "user") {
            window.location.href = "login.html";
        } else {
            document.getElementById("welcomeMessage").innerText =
                "Welcome " + user.name + "!";
        }

        // Logout
        function logout() {
            localStorage.removeItem("user");
            localStorage.removeItem("role");
            window.location.href = "login.html";
        }

    </script>

</body>
</html>
```

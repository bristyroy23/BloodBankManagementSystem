
<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1>🩸 Blood Bank</h1>
        <h2>Hospital Management</h2>

        <form>

            <label>Hospital Name</label>
            <input type="text" placeholder="Enter hospital name" required>

            <label>Contact Number</label>
            <input type="tel" placeholder="Enter phone number" required>

            <label>Email</label>
            <input type="email" placeholder="Enter hospital email">

            <label>Address</label>
            <input type="text" placeholder="Enter hospital address" required>

            <button type="submit">Add Hospital</button>

        </form>

        <br>

        <a href="admin-dashboard.html">Back to Dashboard</a>

    </div>

</body>
</html>
